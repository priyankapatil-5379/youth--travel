spring.application.name=Realestate
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Realestate_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=askl
#changed 1234
 
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
 
# Max request size (all files together)
spring.servlet.multipart.max-request-size=50MB
 
# Tomcat specific limits
server.tomcat.max-swallow-size=50MB
 
file.upload-dir=uploads
 
 
# Disable Whitelabel Error Page
server.error.whitelabel.enabled=false
 
# JSP Configuration
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp
 
 
# Logging
logging.level.com.piligrim==DEBUG
 
 
# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
 
 
# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
 
