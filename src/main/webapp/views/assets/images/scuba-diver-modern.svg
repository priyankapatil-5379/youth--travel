<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="suitMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb" />
      <stop offset="50%" style="stop-color:#1d4ed8" />
      <stop offset="100%" style="stop-color:#1e3a8a" />
    </linearGradient>
    <linearGradient id="tankGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="40%" style="stop-color:#fef3c7" />
      <stop offset="60%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#b45309" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Diver Group -->
  <g filter="url(#dropShadow)">
    <!-- Right Fin -->
    <path d="M50,180 L10,160 Q0,180 10,200 L50,195 Z" fill="#111" />
    <path d="M20,175 L15,185" stroke="#333" stroke-width="2" />

    <!-- Left Fin -->
    <path d="M60,210 L20,240 Q10,220 20,200 L60,205 Z" fill="#222" />

    <!-- Legs -->
    <path d="M55,185 Q100,170 150,180 L160,220 Q100,210 60,205 Z" fill="url(#suitMain)" stroke="#0f172a" stroke-width="1" />
    <path d="M100,185 L140,195" stroke="#ffffff33" stroke-width="3" stroke-linecap="round" />
    
    <!-- Torso -->
    <path d="M150,180 C200,160 350,160 450,190 L430,260 C350,230 200,230 155,240 Z" fill="url(#suitMain)" stroke="#0f172a" stroke-width="1" />
    <!-- Chest detail -->
    <path d="M250,180 Q300,175 350,185" fill="none" stroke="#ffffff22" stroke-width="4" stroke-linecap="round" />

    <!-- Tank -->
    <rect x="220" y="120" width="160" height="50" rx="25" transform="rotate(-5 300 145)" fill="url(#tankGold)" stroke="#92400e" stroke-width="1.5" />
    <path d="M380,140 Q450,140 480,180" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
    <path d="M240,135 L340,135" stroke="#ffffff44" stroke-width="2" />

    <!-- Arms -->
    <path d="M420,210 L500,260 L520,240 L440,190 Z" fill="#1e40af" stroke="#0f172a" stroke-width="1" />
    
    <!-- Head & Helmet -->
    <circle cx="530" cy="210" r="45" fill="#fde68a" />
    <!-- Mask -->
    <path d="M510,180 Q540,165 570,180 L575,225 Q540,240 510,225 Z" fill="#0f172a" />
    <rect x="520,185" width="40" height="30" rx="6" fill="#7dd3fc" opacity="0.6" />
    <path d="M525,190 L540,190" stroke="white" stroke-width="2" opacity="0.5" />
    <!-- Hood -->
    <path d="M515,175 Q540,155 570,175" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
    
    <!-- Regulator -->
    <circle cx="500" cy="230" r="10" fill="#333" />
  </g>
</svg>
