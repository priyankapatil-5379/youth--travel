<!DOCTYPE html>
<html>
<body>
<canvas id="canvas"></canvas>
<script>
const img = new Image();
img.crossOrigin = "anonymous";
img.onload = () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    // Background color in the generated image is a light blue
    // Roughly R:135, G:206, B:235 (SkyBlue) or similar
    // We'll detect pixels that are "bluish" and light.
    
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        
        // Remove light blue background
        // The background in the reference is quite consistent.
        if (b > r && b > g && b > 180 && r > 100 && g > 150) {
            data[i + 3] = 0;
        }
        
        // Remove small isolated objects (fish) by checking distance from center
        // Most fish are in the periphery.
        const x = (i / 4) % canvas.width;
        const y = Math.floor((i / 4) / canvas.width);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const dist = Math.sqrt((x - centerX)**2 + (y - centerY)**2);
        
        // The diver is the main central object. 
        // We'll keep pixels within a central "capsule" or oval.
        if (dist > canvas.width * 0.4) {
            data[i + 3] = 0;
        }
    }
    
    ctx.putImageData(imageData, 0, 0);
    console.log("RESULT_DATA_URI:" + canvas.toDataURL());
};
img.src = "scuba-diver-modern.png";
</script>
</body>
</html>
